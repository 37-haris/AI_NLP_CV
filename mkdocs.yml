site_name: VisionChat — Image Captioning with AI
site_description: Documentation for the VisionChat image captioning application
site_author: Mohammad Haris
theme:
  name: material
  palette:
    - scheme: slate
      primary: deep orange
      accent: orange
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.annotate
    - content.code.copy

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables

nav:
  - Home: index.md
  - Architecture:
    - Overview: architecture/overview.md
    - Flow Diagram: architecture/flow.md
    - Sequence Diagrams: architecture/sequences.md
    - Database Schema: architecture/database.md
  - API Reference:
    - Authentication: api/auth.md
    - Chat: api/chat.md
    - Prediction: api/predict.md
  - Guides:
    - Getting Started: guides/getting-started.md
    - Project Structure: guides/structure.md